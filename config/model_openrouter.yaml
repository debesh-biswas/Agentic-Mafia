name: openrouter-gpt-oss-20b
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
model: openai/gpt-oss-20b
provider_pin:                          # sent as the OpenRouter "provider" field
  order: ["DeepInfra"]                 # pinned 2026-10-20; never change during a run
  allow_fallbacks: false
  require_parameters: true
structured_output: json_schema
reasoning_param: openrouter            # sends {"reasoning": {"effort": "<level>"}}
reasoning:
  plan: medium
  night: medium
  speak: low
  vote: medium
  last_words: low
  reflect: medium
  summaries: low
  deep_reflect: medium
  compress: low
temperature: 0.8
max_output_tokens: {default: 2000, reflect: 3000, summaries: 1500}   # gpt-oss reasoning counts against this; 600 truncated votes/nights
timeout_s: 120
max_concurrency: 7
